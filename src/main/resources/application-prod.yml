server:
  port: ${PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Apply the additive order-submission migration before Hibernate validates the schema.
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V20260915__customer_order_submit_idempotency.sql
      continue-on-error: false

  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  web:
    resources:
      static-locations: file:/app/uploads/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  active-secret: ${JWT_ACTIVE_SECRET}
  legacy-secret: ${JWT_LEGACY_SECRET:}
  expiration-ms: 21600000
  refresh-expiration-ms: 604800000

qr:
  token:
    active-secret: ${QR_ACTIVE_SECRET}
    legacy-secret: ${QR_LEGACY_SECRET:}
    expiration: ${QR_TOKEN_EXPIRATION_MS:604800000}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  auth:
    client-ids: ${GOOGLE_AUTH_CLIENT_IDS:910347869788-astuldpi4hi3hb0osucuoclhfjdh5dtj.apps.googleusercontent.com,910347869788-vh6osb5nv386a6cgc9hpl1vjeq4u9s6v.apps.googleusercontent.com}

stripe:
  billing:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_BILLING_CURRENCY:eur}

app:
  contact:
    enabled: ${CONTACT_MAIL_ENABLED:false}
    recipient: ${CONTACT_MAIL_RECIPIENT:info@cdevia.com}
    from-address: ${CONTACT_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  privacy:
    hash-secret: ${PRIVACY_HASH_SECRET:${JWT_ACTIVE_SECRET}}
  retention:
    table-access-log-days: ${RETENTION_TABLE_ACCESS_LOG_DAYS:90}
    table-device-days: ${RETENTION_TABLE_DEVICE_DAYS:180}
    event-log-days: ${RETENTION_EVENT_LOG_DAYS:180}
    stripe-webhook-days: ${RETENTION_STRIPE_WEBHOOK_DAYS:90}
    admin-audit-days: ${RETENTION_ADMIN_AUDIT_DAYS:730}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://waitero-front.vercel.app,https://localhost,http://localhost,capacitor://localhost}
  master:
    bootstrap-emails: ${MASTER_BOOTSTRAP_EMAILS:}
  local-login:
    restaurant-bootstrap-password: ${LOCAL_RESTAURATEUR_BOOTSTRAP_PASSWORD:}

