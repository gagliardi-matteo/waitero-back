jwt:
  active-secret: campaign-test-only-jwt-secret-at-least-32-characters
  legacy-secret: ''
qr:
  token:
    active-secret: campaign-test-only-qr-secret-at-least-32-characters
    legacy-secret: ''
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:tc:postgresql:15-alpine:///waitero_test}
    username: ${TEST_DB_USERNAME:test}
    password: ${TEST_DB_PASSWORD:test}
    driver-class-name: ${TEST_DB_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
app:
  cors:
    allowed-origin-patterns: http://localhost
  master:
    bootstrap-emails:
  local-login:
    restaurant-bootstrap-password:
