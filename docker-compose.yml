version: "3.9"

services:

  db:
    image: postgres:15
    container_name: waitero-db
    restart: always
    environment:
      POSTGRES_DB: waitero
      POSTGRES_USER: waitero
      POSTGRES_PASSWORD: waitero
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - waitero-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waitero"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waitero-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local development only. Do not deploy this demo-credential Compose in production.
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/waitero
      SPRING_DATASOURCE_USERNAME: waitero
      SPRING_DATASOURCE_PASSWORD: waitero
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FILE_UPLOAD_DIR: /app/uploads
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_BILLING_CURRENCY: ${STRIPE_BILLING_CURRENCY:-eur}
      CONTACT_MAIL_ENABLED: ${CONTACT_MAIL_ENABLED:-false}
      CONTACT_MAIL_RECIPIENT: ${CONTACT_MAIL_RECIPIENT:-info@cdevia.com}
      CONTACT_MAIL_FROM: ${CONTACT_MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SSL_ENABLE: ${SPRING_MAIL_SSL_ENABLE:-false}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-true}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    networks:
      - waitero-network

volumes:
  postgres_data:
  uploads:

networks:
  waitero-network:
    driver: bridge
